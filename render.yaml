services:
  - type: web
    name: ab-testing-survey
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run src/app/main.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
